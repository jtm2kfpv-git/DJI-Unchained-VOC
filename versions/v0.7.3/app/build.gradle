plugins {
    id "com.android.application"
}

android {
    namespace = "local.djiunchained.voc"
    compileSdk = 36

    defaultConfig {
        applicationId = "local.djiunchained.voc"
        minSdk = 29
        targetSdk = 36
        versionCode = 10
        versionName = "0.7.3"

        testInstrumentationRunner = "android.app.Instrumentation"
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError = true
        warningsAsErrors = true
        checkReleaseBuilds = true
        // API 36 is intentional: this probe targets the user's Android 16 device.
        // The newer API 37 package is not available from the installed stable SDK channel.
        disable += ["OldTargetApi", "GradleDependency"]
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
